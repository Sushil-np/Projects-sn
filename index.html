<!DOCTYPE html>
<html>
    <head>
        <title>
            INdex
        </title>
    </head>
    <body>
        <script>
            a=parseFloat(prompt("Enter the value of a"));
            b=parseFloat(prompt("Enter the value of b"));
            document.write("The value you entered of a and b are "+a +" & "+ b+ "respectively.<br/>");
            temp=a;
            a=b;
            b=temp;
            document.write("The  value of a after swap:" +a);
            document.write("</br> The  value of a before swap:" +b);
            c=a+b;
            document.write("</br> The sum of two number is :" +c);
            
        </script>
    </body>
</html>
